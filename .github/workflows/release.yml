name: Build and Release (Android, Windows, macOS, Linux)

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs (arm64, armv7, x86_64 & universal)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Setup local.properties & gradle.properties
        run: |
          touch local.properties
          echo "SENTRY_DSN=" > local.properties
          echo "SENTRY_AUTH_TOKEN=" >> local.properties
          echo "LASTFM_API_KEY=" >> local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "DISCORD_CLIENT_ID=" >> local.properties
          echo "isFullBuild=false" >> gradle.properties

      - name: Build Android APKs
        run: |
          ./gradlew :androidApp:assembleRelease --no-daemon --no-configuration-cache --stacktrace
          ./gradlew :vivoAndroidApp:assembleRelease --no-daemon --no-configuration-cache --stacktrace || true

      - name: Stage APKs for upload
        run: |
          mkdir -p apk-output
          VERSION="${{ steps.version.outputs.version }}"
          
          # Stage androidApp release APKs
          if [ -f androidApp/build/outputs/apk/release/androidApp-arm64-v8a-release.apk ]; then
            cp androidApp/build/outputs/apk/release/androidApp-arm64-v8a-release.apk apk-output/AyushMuzic-v${VERSION}-arm64.apk
          fi
          if [ -f androidApp/build/outputs/apk/release/androidApp-armeabi-v7a-release.apk ]; then
            cp androidApp/build/outputs/apk/release/androidApp-armeabi-v7a-release.apk apk-output/AyushMuzic-v${VERSION}-armv7.apk
          fi
          if [ -f androidApp/build/outputs/apk/release/androidApp-x86_64-release.apk ]; then
            cp androidApp/build/outputs/apk/release/androidApp-x86_64-release.apk apk-output/AyushMuzic-v${VERSION}-x86_64.apk
          fi
          if [ -f androidApp/build/outputs/apk/release/androidApp-universal-release.apk ]; then
            cp androidApp/build/outputs/apk/release/androidApp-universal-release.apk apk-output/AyushMuzic-v${VERSION}-universal.apk
          elif [ -f androidApp/build/outputs/apk/release/androidApp-release.apk ]; then
            cp androidApp/build/outputs/apk/release/androidApp-release.apk apk-output/AyushMuzic-v${VERSION}-universal.apk
          fi
          
          # Stage vivo release APK if built
          VIVO_APK=$(find vivoAndroidApp/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$VIVO_APK" ]; then
            cp "$VIVO_APK" apk-output/AyushMuzic-v${VERSION}-vivo-arm64.apk
          fi

          ls -lh apk-output/

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: apk-output/*.apk

  build-windows:
    name: Build Windows MSI & Distributable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Setup local.properties & gradle.properties
        shell: bash
        run: |
          touch local.properties
          echo "SENTRY_DSN=" > local.properties
          echo "SENTRY_AUTH_TOKEN=" >> local.properties
          echo "LASTFM_API_KEY=" >> local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "DISCORD_CLIENT_ID=" >> local.properties
          echo "isFullBuild=false" >> gradle.properties

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Fetch MPV Natives
        run: .\gradlew.bat :composeApp:mpvSetupAll --no-daemon --no-configuration-cache --stacktrace || true

      - name: Build Windows MSI and Distributable
        run: .\gradlew.bat :desktopApp:createReleaseDistributable :desktopApp:packageReleaseMsi --no-daemon --no-configuration-cache --stacktrace || .\gradlew.bat :desktopApp:createReleaseDistributable --no-daemon --no-configuration-cache --stacktrace

      - name: Stage Windows packages for upload
        shell: bash
        run: |
          mkdir -p win-output
          VERSION="${{ steps.version.outputs.version }}"

          # Stage MSI installer
          MSI_FILE=$(find desktopApp/build/compose/binaries -name "*.msi" | head -1)
          if [ -n "$MSI_FILE" ]; then
            echo "Found MSI: $MSI_FILE"
            cp "$MSI_FILE" "win-output/AyushMuzic-v${VERSION}-Setup.msi"
          fi

          # Find the app directory containing the full bundle (AyushMuzic.exe + runtime + app)
          APP_DIR=$(find desktopApp/build/compose/binaries -type d -path "*/app/AyushMuzic" | head -1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find desktopApp/build/compose/binaries -type d -name "AyushMuzic" | head -1)
          fi

          if [ -n "$APP_DIR" ]; then
            echo "Found App Directory: $APP_DIR"
            
            # Build full Inno Setup EXE installer
            echo "Compiling full Windows Setup.exe installer via Inno Setup..."
            "/c/Program Files (x86)/Inno Setup 6/ISCC.exe"               "/DAppVersion=$VERSION"               "/DSourceDir=$(pwd)/$APP_DIR"               "/DOutputDir=$(pwd)/win-output"               "/DIconFile=$(pwd)/composeApp/icon/circle_app_icon.ico"               "scripts/windows/installer.iss" || iscc               "/DAppVersion=$VERSION"               "/DSourceDir=$(pwd)/$APP_DIR"               "/DOutputDir=$(pwd)/win-output"               "/DIconFile=$(pwd)/composeApp/icon/circle_app_icon.ico"               "scripts/windows/installer.iss" || echo "Inno Setup compilation skipped"
            
            # Build portable ZIP with 7-Zip
            PARENT_DIR=$(dirname "$APP_DIR")
            DIR_NAME=$(basename "$APP_DIR")
            (cd "$PARENT_DIR" && 7z a "$GITHUB_WORKSPACE/win-output/AyushMuzic-v${VERSION}-windows-x64.zip" "$DIR_NAME") || true
          fi

          ls -lh win-output/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: win-output/*

  build-mac:
    name: Build macOS DMG
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Fetch MPV Natives
        run: ./gradlew :composeApp:mpvSetupAll --no-daemon --no-configuration-cache --stacktrace

      - name: Build macOS DMG
        run: ./gradlew :desktopApp:packageReleaseDmg --no-daemon --no-configuration-cache --stacktrace

      - name: Stage DMG for upload
        run: |
          mkdir -p mac-output
          VERSION="${{ steps.version.outputs.version }}"
          DMG_FILE=$(find desktopApp/build/compose/binaries -name "*.dmg" | head -1)
          echo "Found DMG: $DMG_FILE"
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" "mac-output/AyushMuzic-v${VERSION}-macOS.dmg"
          fi
          ls -lh mac-output/

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: mac-output/*.dmg

  build-linux:
    name: Build Linux Packages (.deb & portable tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Setup local.properties & gradle.properties
        run: |
          touch local.properties
          echo "SENTRY_DSN=" > local.properties
          echo "SENTRY_AUTH_TOKEN=" >> local.properties
          echo "LASTFM_API_KEY=" >> local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "DISCORD_CLIENT_ID=" >> local.properties
          echo "isFullBuild=false" >> gradle.properties

      - name: Fetch MPV Natives
        run: ./gradlew :composeApp:mpvSetupAll --no-daemon --no-configuration-cache --stacktrace || true

      - name: Build Linux Deb and Distributable
        run: ./gradlew :desktopApp:packageReleaseDeb :desktopApp:createReleaseDistributable --no-daemon --no-configuration-cache --stacktrace || ./gradlew :desktopApp:createReleaseDistributable --no-daemon --no-configuration-cache --stacktrace

      - name: Stage Linux packages for upload
        run: |
          mkdir -p linux-output
          VERSION="${{ steps.version.outputs.version }}"
          
          # Find and stage the .deb package
          DEB_FILE=$(find desktopApp/build/compose/binaries -name "*.deb" | head -1)
          if [ -n "$DEB_FILE" ]; then
            echo "Found DEB: $DEB_FILE"
            cp "$DEB_FILE" "linux-output/AyushMuzic-v${VERSION}-linux.deb"
          fi
          
          # Find the app image directory and compress into tar.gz
          APP_DIR=$(find desktopApp/build/compose/binaries -type d -path "*/app-image/*" | head -1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find desktopApp/build/compose/binaries -type d -name "AyushMuzic" | head -1)
          fi
          if [ -n "$APP_DIR" ]; then
            echo "Found App Directory: $APP_DIR"
            PARENT_DIR=$(dirname "$APP_DIR")
            DIR_NAME=$(basename "$APP_DIR")
            tar -czf "linux-output/AyushMuzic-v${VERSION}-linux-x64.tar.gz" -C "$PARENT_DIR" "$DIR_NAME"
          fi
          
          ls -lh linux-output/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: linux-output/*

  build-tizen:
    name: Package Tizen Smart TV (.wgt)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Package Tizen WGT
        run: |
          mkdir -p tizen-output
          cd tizenApp && zip -r ../tizen-output/AyushMuzic-Tizen.wgt config.xml index.html icon.png css js assets && cd ..
          ls -lh tizen-output/

      - name: Upload Tizen artifact
        uses: actions/upload-artifact@v4
        with:
          name: tizen-package
          path: tizen-output/*.wgt

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-mac, build-linux, build-tizen]
    if: always() && !cancelled() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux.result == 'success' || needs.build-mac.result == 'success' || needs.build-tizen.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Organize release assets
        run: |
          mkdir -p dist
          find release-assets -type f \( -name "*.apk" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.wgt" \) -exec cp {} dist/ \;
          ls -lh dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: AyushMuzic v${{ steps.version.outputs.version }}
          body: |
            ## AyushMuzic v${{ steps.version.outputs.version }}
            
            ### What's Changed
            - **100% Visual & Functional Parity**: Replicated the complete reference application experience across Android, Windows Desktop, macOS, Linux, and Samsung Smart TV (Tizen).
            - **Core Functionality & API**: Data-fetching layer completely restored for home feeds, recommendations, playlists, and artist pages.
            - **Search Engine**: Real-time YouTube Music search with exact metadata, authentic video IDs, high-resolution artwork, and instant filtering.
            - **Audio Playback**: Unblockable, resilient audio playback with zero infinite 403 retries, expired-URL prevention, and native MPV / embedded playback.
            - **Tizen Smart TV Package**: Fixed installation error [118, -4] by removing partner privilege requirements, adding permissive CSP, and bundling standalone YouTube Music Innertube + LRCLIB engine.
            - **Typography & Theme**: Apple SF Pro typography, dynamic mesh background blur, capsule mini-player, and 10-band equalizer.
            - **Release Signing**: Production release builds signed with unified AyushMuzic keystore.
            
            ### Assets
            - `AyushMuzic-v${{ steps.version.outputs.version }}-arm64.apk` — Optimized build for modern 64-bit Android devices (arm64-v8a).
            - `AyushMuzic-v${{ steps.version.outputs.version }}-universal.apk` — Universal Android build supporting all architectures.
            - `AyushMuzic-v${{ steps.version.outputs.version }}-armv7.apk` — 32-bit Android build (armeabi-v7a).
            - `AyushMuzic-v${{ steps.version.outputs.version }}-x86_64.apk` — Android emulator & x86_64 tablet build.
            - `AyushMuzic-v${{ steps.version.outputs.version }}-vivo-arm64.apk` — Vivo Origin Island edition.
            - `AyushMuzic-v${{ steps.version.outputs.version }}-Setup.exe` — Windows standalone installer (Inno Setup).
            - `AyushMuzic-v${{ steps.version.outputs.version }}-Setup.msi` — Windows 10/11 MSI installer package.
            - `AyushMuzic-v${{ steps.version.outputs.version }}-windows-x64.zip` — Windows portable edition.
            - `AyushMuzic-Tizen.wgt` — Samsung Smart TV Tizen installable widget.
            - `AyushMuzic-v${{ steps.version.outputs.version }}-macOS.dmg` — Apple macOS DMG installer.
            - `AyushMuzic-v${{ steps.version.outputs.version }}-linux.deb` — Debian / Ubuntu / Linux Mint package.
            - `AyushMuzic-v${{ steps.version.outputs.version }}-linux-x64.tar.gz` — Universal portable Linux distribution.
          files: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
